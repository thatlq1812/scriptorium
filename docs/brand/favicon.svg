    <polygon points="302,303  327,259  306,236" fill="#6366f1" opacity="0.86" />
    <!-- polygon-15 -->
    <polygon points="214,334  306,236  285,207" fill="#4c1d95" opacity="0.92" />
    <!-- polygon-16 -->
    <polygon points="306,236  285,207  384,159" fill="#c4b5fd" opacity="0.92" />
    <!-- polygon-17 -->
    <polygon points="306,236  358,213  384,159" fill="#818cf8" opacity="0.88" />
    <!-- polygon-18 -->
    <polygon points="320,235  348,228  340,250" fill="#6366f1" opacity="0.85" />
    <!-- polygon-19 -->
    <polygon points="348,228  353,240  340,250" fill="#a78bfa" opacity="0.85" />
