    <polygon points="272,202  330,139  294,104" fill="#7c3aed" opacity="0.88" />
    <!-- polygon-25 -->
    <polygon points="192,320  186,226  230,207" fill="#e0e7ff" opacity="0.94" />
    <!-- polygon-26 -->
    <polygon points="192,320  230,207  260,170  272,202" fill="#c4b5fd" opacity="0.92" />
    <!-- polygon-27 -->
    <polygon points="186,226  230,207  251,136" fill="#ddd6fe" opacity="0.92" />
    <!-- polygon-28 -->
    <polygon points="230,207  260,170  251,136" fill="#a78bfa" opacity="0.88" />
    <!-- polygon-29 -->
    <polygon points="272,202  271,124  251,136" fill="#818cf8" opacity="0.88" />
  </g>

  <!-- CYAN GLOWING NIB TIP DOT -->
  <g filter="url(#cyanGlow)">
    <circle cx="125" cy="470" r="6" fill="#a5b4fc" opacity="0.95" />
  </g>

  <!-- SPARKLE STARS -->
  <g fill="#e0e7ff" filter="url(#starGlow)">
    <path d="M166,134 L170,145 L181,148 L170,151 L166,162 L162,151 L151,148 L162,145 Z" opacity="0.95" />
    <path d="M209,101 L212,108 L219,110 L212,112 L209,119 L206,112 L199,110 L206,108 Z" opacity="0.85" />
