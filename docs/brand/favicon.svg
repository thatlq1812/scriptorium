</g>

  <!-- TOP-RIGHT "ELIX" WORDMARK (stacked, no frame) -->
  <g filter="url(#monoGlow-scriptorium)" text-anchor="middle"
     font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="800">
    <text x="384" y="100" font-size="102.0" letter-spacing="1" fill="url(#g-mono-scriptorium)">EL</text>
    <text x="384" y="214.0" font-size="102.0" letter-spacing="1" fill="url(#g-mono-scriptorium)">IX</text>
  </g>

  <!-- CORNER ACCENT: bottom-left, balances the icon/monogram diagonal -->
  <g filter="url(#starGlow)">
    <path d="M76.0,414.0 L80.0,425.0 L91.0,428.0 L80.0,431.0 L76.0,442.0 L72.0,431.0 L61.0,428.0 L72.0,425.0 Z" fill="#818cf8" opacity="0.85"/>
    <path d="M156.0,452.0 L159.0,459.5 L167.0,462.0 L159.0,464.5 L156.0,472.0 L153.0,464.5 L145.0,462.0 L153.0,459.5 Z" fill="#e0e7ff" opacity="0.9"/>
    <path d="M112.0,376.0 L114.0,380.5 L119.0,382.0 L114.0,383.5 L112.0,388.0 L110.0,383.5 L105.0,382.0 L110.0,380.5 Z" fill="#e0e7ff" opacity="0.7"/>
    <circle cx="44" cy="452" r="1.6" fill="#ffffff" opacity="0.55"/>
  </g>

  <!-- SUB-BRAND MONOGRAM -->
  <g filter="url(#monoGlow-scriptorium)">
    <text x="480" y="440" text-anchor="end"
      font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
      font-weight="800" font-size="260" letter-spacing="-2"
      fill="url(#g-mono-scriptorium)">St</text>
  </g>
  <rect x="220.0" y="458" width="260.0" height="9" rx="4.5" fill="#818cf8" opacity="0.9"/>
</svg>
