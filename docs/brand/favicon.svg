<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#19173d" />
      <stop offset="100%" stop-color="#0a081a" />
    </linearGradient>
    <radialGradient id="halo" cx="46%" cy="54%" r="42%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#4f46e5" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="tipGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.90" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.40" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="cyanGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
      <linearGradient id="g-mono-scriptorium" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="monoGlow-scriptorium" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="g-border-scriptorium" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="88" fill="url(#bg)" />

  <rect x="6" y="6" width="500" height="500" rx="84" fill="none" stroke="url(#g-border-scriptorium)" stroke-width="12" opacity="0.95"/>
  <g transform="translate(-70.72,-23.92) scale(0.78)">
  <ellipse cx="236" cy="276" rx="190" ry="210" fill="url(#halo)" />
  <ellipse cx="236" cy="460" rx="90" ry="20" fill="url(#tipGlow)" opacity="0.45" />

  <!-- SNAPPED CRYSTAL FEATHER FACETS -->
  <g stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.15" stroke-linejoin="round">
    <!-- polygon-1 -->
    <polygon points="124,470  131,433  147,428" fill="#a5f3fc" opacity="0.95" />
    <!-- polygon-2 -->
