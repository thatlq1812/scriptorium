    <!-- polygon-11 -->
    <polygon points="187,331  168,320  174,250" fill="#e0e7ff" opacity="0.94" />
    <!-- polygon-12 -->
    <polygon points="168,320  152,302  174,250" fill="#c4b5fd" opacity="0.90" />
    <!-- polygon-13 -->
    <polygon points="214,334  302,303  306,236" fill="#7c3aed" opacity="0.90" />
